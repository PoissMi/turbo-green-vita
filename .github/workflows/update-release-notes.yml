name: Update release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.2.0
      body_path:
        description: Markdown release-note file
        required: true
        default: docs/releases/v0.2.0.md

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected tag" >&2; exit 1; }
          [[ "${{ inputs.body_path }}" =~ ^docs/releases/v[0-9]+\.[0-9]+\.[0-9]+\.md$ ]] || { echo "Unexpected body path" >&2; exit 1; }
          [[ -s "${{ inputs.body_path }}" ]] || { echo "Release-note file is missing or empty" >&2; exit 1; }

      - name: Update release description
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Turbo GreenVita ${{ inputs.tag }}
          body_path: ${{ inputs.body_path }}
          generate_release_notes: false
